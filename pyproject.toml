[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cta-game-importer"
version = "0.1.0"
description = "Versioned, plugin-based game data import infrastructure"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cta-import = "cta_importer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cta_importer = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

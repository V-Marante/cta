name: Deploy approved Fly image

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: Immutable, previously approved Fly registry image reference
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-fly
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      - name: Deploy exact prebuilt image
        run: flyctl deploy --remote-only=false --image "${{ inputs.image_ref }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - name: Restore, build, and test API
        run: |
          dotnet restore api/Cta.Api.Tests/Cta.Api.Tests.csproj
          dotnet build api/Cta.Api.Tests/Cta.Api.Tests.csproj --configuration Release --no-restore
          dotnet test api/Cta.Api.Tests/Cta.Api.Tests.csproj --configuration Release --no-build --no-restore
      - name: Run importer tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v

  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/cta-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/cta-web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  container-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate synthetic public database generator
        run: |
          python3 scripts/create-synthetic-public-db.py /tmp/cta-synthetic/cta.sqlite
          scripts/validate-public-artifacts.sh /tmp/cta-synthetic
      - name: Build synthetic unified image
        run: docker build --target runtime --build-arg RELEASE_MODE=synthetic --build-arg VCS_REF=${{ github.sha }} --tag cta:synthetic .
      - name: Start and smoke-test unified image
        run: RELEASE_IMAGE=cta:synthetic scripts/smoke-test-image.sh
